name: PPI stable instrument ID allocation pilot
run-name: Stable ID allocation from OpenFIGI review ${{ inputs.review_run_id || github.event.workflow_run.id }}-${{ inputs.review_run_attempt || github.event.workflow_run.run_attempt }}

on:
  workflow_run:
    workflows:
      - PPI OpenFIGI mapping artifact review
    types:
      - completed
  workflow_dispatch:
    inputs:
      review_run_id:
        description: Exact successful OpenFIGI mapping artifact-review run ID
        required: true
        type: string
      review_run_attempt:
        description: Exact review workflow run attempt
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: ppi-stable-instrument-id-allocation-${{ github.event.workflow_run.id || inputs.review_run_id }}
  cancel-in-progress: true

jobs:
  allocate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REVIEW_RUN_ID: ${{ github.event.workflow_run.id || inputs.review_run_id }}
      REVIEW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.review_run_attempt }}
      OUTPUT_ROOT: runtime/ppi-stable-instrument-id-allocation-pilot
    steps:
      - name: Check out approved main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Validate code and boundaries
        run: |
          set -euo pipefail
          python -m py_compile scripts/allocate_stable_instrument_ids.py
          python -m unittest tests.test_ppi_stable_instrument_id_allocation_pilot -v

      - name: Download exact OpenFIGI mapping review artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$REVIEW_RUN_ID" in (*[!0-9]*|'') exit 1 ;; esac
          case "$REVIEW_RUN_ATTEMPT" in (*[!0-9]*|'') exit 1 ;; esac
          mkdir -p review-run downloaded-review
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN_ID}" \
            > review-run/run.json
          artifact_name="ppi-openfigi-mapping-artifact-review-${REVIEW_RUN_ID}-${REVIEW_RUN_ATTEMPT}"
          gh run download "$REVIEW_RUN_ID" \
            --name "$artifact_name" \
            --dir downloaded-review

      - name: Enforce passed OpenFIGI review before stable ID allocation
        id: preflight
        run: |
          set -euo pipefail
          python scripts/allocate_stable_instrument_ids.py preflight \
            --review-root downloaded-review \
            --review-run-json review-run/run.json \
            --review-run-id "$REVIEW_RUN_ID" \
            --review-run-attempt "$REVIEW_RUN_ATTEMPT" \
            --output-root "$OUTPUT_ROOT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download exact reviewed OpenFIGI mapping artifact
        if: steps.preflight.outputs.gate_passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.preflight.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.preflight.outputs.source_run_attempt }}
        run: |
          set -euo pipefail
          case "$SOURCE_RUN_ID" in (*[!0-9]*|'') exit 1 ;; esac
          case "$SOURCE_RUN_ATTEMPT" in (*[!0-9]*|'') exit 1 ;; esac
          mkdir -p downloaded-mapping
          artifact_name="ppi-openfigi-mapping-pilot-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          gh run download "$SOURCE_RUN_ID" \
            --name "$artifact_name" \
            --dir downloaded-mapping

      - name: Allocate deterministic IDs only for exact FIGI mappings
        if: steps.preflight.outputs.gate_passed == 'true'
        run: |
          set -euo pipefail
          python scripts/allocate_stable_instrument_ids.py allocate \
            --review-root downloaded-review \
            --review-run-json review-run/run.json \
            --review-run-id "$REVIEW_RUN_ID" \
            --review-run-attempt "$REVIEW_RUN_ATTEMPT" \
            --source-root downloaded-mapping \
            --output-root "$OUTPUT_ROOT"

      - name: Publish allocation summary
        if: always()
        run: |
          set -euo pipefail
          if [ -s "$OUTPUT_ROOT/report.md" ]; then
            cat "$OUTPUT_ROOT/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '# PPI stable instrument ID allocation pilot\n\nNo report was produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain safe allocation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ppi-stable-instrument-id-allocation-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/ppi-stable-instrument-id-allocation-pilot/
          retention-days: 14
          if-no-files-found: error
