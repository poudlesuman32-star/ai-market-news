name: PPI migration autopilot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ppi-public-migration-scheduler.yml
      - scripts/ppi_migration_autopilot.py
      - scripts/ppi_migration_autopilot_v2.py
      - scripts/ppi_migration_autopilot_v3.py
      - scripts/ppi_migration_autopilot_v4.py
      - scripts/enable_ppi_private_actions_once.py
      - scripts/enrich_ppi_private_queue_diagnostics.py
      - scripts/prepare_ppi_target_update_branch.py
      - scripts/publish_ppi_autopilot_status.py
      - scripts/bootstrap_ppi_data_acquisition.py
      - scripts/bootstrap_ppi_data_acquisition_r2.py
      - bootstrap/ppi-data-acquisition/**
      - config/ppi_public_migration_schedule.json
      - tests/test_ppi_public_migration_scheduler.py
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: ppi-migration-autopilot
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUTPUT_ROOT: runtime/ppi-migration-autopilot
      RAW_TOKEN: ${{ secrets.RAW_TOKEN }}
      PPI_ALPHA_VANTAGE_API_KEY: ${{ secrets.PPI_ALPHA_VANTAGE_API_KEY }}
      PPI_MARKETDATA_TOKEN: ${{ secrets.PPI_MARKETDATA_TOKEN }}
    steps:
      - name: Check out approved main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Validate autopilot code and authority boundaries
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/bootstrap_ppi_data_acquisition.py \
            scripts/bootstrap_ppi_data_acquisition_r2.py \
            scripts/build_ppi_public_migration_readiness.py \
            scripts/ppi_migration_autopilot.py \
            scripts/ppi_migration_autopilot_v2.py \
            scripts/ppi_migration_autopilot_v3.py \
            scripts/ppi_migration_autopilot_v4.py \
            scripts/enable_ppi_private_actions_once.py \
            scripts/enrich_ppi_private_queue_diagnostics.py \
            scripts/prepare_ppi_target_update_branch.py \
            scripts/publish_ppi_autopilot_status.py
          python -m unittest tests.test_ppi_public_migration_scheduler -v

      - name: Enable private Actions with selected GitHub-owned actions only
        run: |
          set -euo pipefail
          python scripts/enable_ppi_private_actions_once.py

      - name: Prepare exact post-squash target update branch
        run: |
          set -euo pipefail
          python scripts/prepare_ppi_target_update_branch.py

      - name: Reconcile the next safe migration action
        run: |
          set -euo pipefail
          python scripts/ppi_migration_autopilot_v4.py \
            --output-root "$OUTPUT_ROOT"

      - name: Build fail-safe status when reconciliation stopped early
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s "$OUTPUT_ROOT/autopilot.json" ]; then
            mkdir -p "$OUTPUT_ROOT"
            python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          report = {
              "schema_version": "1.0.0",
              "status": "failed_before_report",
              "token_login": "unresolved",
              "target_permission": "unresolved",
              "private_permission": "unresolved",
              "actions": [],
              "blocked_reasons": ["The autopilot stopped before producing its normal report. Inspect the linked public workflow run."],
              "run": {
                  "repository": os.environ.get("GITHUB_REPOSITORY", ""),
                  "run_id": os.environ.get("GITHUB_RUN_ID", ""),
                  "attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
                  "head_sha": os.environ.get("GITHUB_SHA", ""),
                  "event": os.environ.get("GITHUB_EVENT_NAME", ""),
                  "generated_at_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              },
              "authority": {
                  "bootstrap_sync": False,
                  "target_secret_sync": False,
                  "target_pr_merge_after_machine_gates": False,
                  "public_collection_dispatch": False,
                  "private_final_analysis_dispatch": False,
                  "registry_mutation": False,
                  "production": False,
                  "publication": False,
                  "broker": False,
                  "orders": False,
                  "trading": False,
                  "mmm_raw_data": False,
                  "r12": False,
              },
          }
          Path(os.environ["OUTPUT_ROOT"]).joinpath("autopilot.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          fi

      - name: Enrich private queue and Actions usage diagnostics
        if: always()
        run: |
          set -euo pipefail
          python scripts/enrich_ppi_private_queue_diagnostics.py \
            --report "$OUTPUT_ROOT/autopilot.json"

      - name: Publish sanitized status to issue 83
        if: always()
        run: |
          set -euo pipefail
          python scripts/publish_ppi_autopilot_status.py \
            --report "$OUTPUT_ROOT/autopilot.json"

      - name: Publish autopilot summary
        if: always()
        run: |
          set -euo pipefail
          if [ -s "$OUTPUT_ROOT/autopilot.md" ]; then
            cat "$OUTPUT_ROOT/autopilot.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## PPI migration autopilot\n\nSee issue #83 for the sanitized fail-safe status.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain autopilot report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ppi-migration-autopilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/ppi-migration-autopilot/
          retention-days: 14
          if-no-files-found: error
