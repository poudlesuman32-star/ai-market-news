name: PPI public-first blocker remediation CI

on:
  push:
    branches:
      - automation/ppi-blocker-remediation-framework-20260827
  pull_request:
    paths:
      - 'docs/architecture/PPI_PUBLIC_FIRST_BLOCKER_REMEDIATION.md'
      - 'contracts/PPI-PUBLIC-FIRST-BLOCKER-REMEDIATION-001-R1.json'
      - 'scripts/classify_ppi_public_first_blocker.py'
      - 'tests/test_ppi_public_first_blocker_remediation.py'
      - '.github/workflows/ppi-public-first-blocker-remediation-ci.yml'

permissions:
  contents: read

jobs:
  blocker-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile blocker policy classifier and progress-report validator
        run: python -m py_compile scripts/classify_ppi_public_first_blocker.py
      - name: Run zero-network blocker policy and progress-report tests
        env:
          NO_PROXY: '*'
        run: |
          export no_proxy="$NO_PROXY"
          python -m unittest tests.test_ppi_public_first_blocker_remediation -v
