name: PPI SEC 500-instrument universe pilot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ppi-sec-universe-pilot.yml
      - contracts/PPI-SEC-UNIVERSE-PILOT-001-R1.json
      - schemas/ppi_sec_universe_pilot.schema.json
      - scripts/collect_sec_universe_pilot.py
      - tests/test_ppi_sec_universe_pilot.py
      - config/ppi_public_source_inventory.json
      - contracts/PPI-UNIVERSE-US-COMMON-001-R1.json
  schedule:
    - cron: '37 6 * * 3'

permissions:
  contents: read

concurrency:
  group: ppi-sec-universe-pilot
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OUTPUT_ROOT: runtime/ppi-sec-universe-pilot
      PPI_SEC_USER_AGENT: ${{ vars.PPI_SEC_USER_AGENT }}
    steps:
      - name: Check out approved main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Validate code and boundaries
        run: |
          set -euo pipefail
          python -m py_compile scripts/collect_sec_universe_pilot.py
          python -m unittest tests.test_ppi_sec_universe_pilot -v

      - name: Collect or report missing SEC user agent
        run: |
          set -euo pipefail
          python scripts/collect_sec_universe_pilot.py \
            --output-root "$OUTPUT_ROOT" \
            --blocked-if-missing-user-agent

      - name: Publish pilot summary
        if: always()
        run: |
          set -euo pipefail
          if [ -s "$OUTPUT_ROOT/report.md" ]; then
            cat "$OUTPUT_ROOT/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## PPI SEC universe pilot\n\nNo report was produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain safe pilot artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ppi-sec-universe-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/ppi-sec-universe-pilot/
          retention-days: 14
          if-no-files-found: error
