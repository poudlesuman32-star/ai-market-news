name: PPI R11 R2 alignment docs CI

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/architecture/PPI_R11_BATCH3_R2_ALIGNMENT_ADDENDUM.md"
      - ".github/workflows/ppi-r11-r2-alignment-docs-ci.yml"

permissions:
  contents: read

jobs:
  validate-r2-alignment-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate frozen R2 architecture claims
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/architecture/PPI_R11_BATCH3_R2_ALIGNMENT_ADDENDUM.md")
          text = path.read_text(encoding="utf-8")

          required = [
              "PPI-R11-PUBLIC-ACQUISITION-003-R2",
              "PPI-PUBLIC-COLLECTOR-003-R2",
              "PPI-R11-BATCH-EVIDENCE-003-R1",
              "48",
              "50",
              "49",
          ]
          missing = [value for value in required if value not in text]
          assert not missing, f"missing frozen R2 alignment claims: {missing}"

          lowered = text.lower()
          assert "manual" in lowered, "manual-only pilot boundary must remain documented"
          for forbidden in (
              "automatic trading enabled",
              "broker authority enabled",
              "production authority enabled",
              "registry mutation authorized",
          ):
              assert forbidden not in lowered, forbidden
          PY
