name: PPI SEC artifact reviewer offline CI

on:
  push:
    branches:
      - automation/sec-review-ci-yaml-registration-fix-20260829
  pull_request:
    branches:
      - main
    paths:
      - scripts/review_sec_universe_pilot_artifact.py
      - tests/test_ppi_sec_universe_artifact_review.py
      - contracts/PPI-SEC-UNIVERSE-PILOT-001-R1.json
      - contracts/PPI-SEC-UNIVERSE-ARTIFACT-REVIEW-001-R1.json
      - .github/workflows/ppi-sec-universe-artifact-review.yml
      - .github/workflows/ppi-sec-artifact-review-offline-ci.yml

permissions:
  contents: read

jobs:
  offline-reviewer-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull-request revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile reviewer
        run: python -m py_compile scripts/review_sec_universe_pilot_artifact.py
      - name: Run zero-network SEC reviewer tests
        env:
          NO_PROXY: '*'
          no_proxy: '*'
        run: python -m unittest tests.test_ppi_sec_universe_artifact_review -v
