name: PPI public-first chain-depth bridge CI

on:
  push:
    branches:
      - automation/public-first-chain-depth-bridge-20260829
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ppi-public-first-chain-depth-bridge.yml
      - .github/workflows/ppi-immutable-snapshot-review-bridge.yml
      - .github/workflows/ppi-stable-instrument-id-allocation-pilot.yml
      - .github/workflows/ppi-stable-instrument-id-allocation-artifact-review.yml
      - .github/workflows/ppi-immutable-universe-snapshot-pilot.yml
      - .github/workflows/ppi-immutable-universe-snapshot-artifact-review.yml
      - .github/workflows/ppi-public-first-chain-depth-bridge-ci.yml
      - scripts/review_stable_instrument_id_allocation.py
      - scripts/review_stable_instrument_id_allocation_hardened.py
      - scripts/assemble_immutable_universe_snapshot.py
      - scripts/assemble_immutable_universe_snapshot_hardened.py
      - scripts/review_immutable_universe_snapshot.py
      - scripts/review_immutable_universe_snapshot_hardened.py
      - tests/test_ppi_public_first_chain_depth_bridge.py
      - tests/test_ppi_immutable_snapshot_review_bridge.py
      - tests/test_ppi_stable_instrument_id_allocation_artifact_review.py
      - tests/test_ppi_stable_instrument_id_allocation_durable_identity.py
      - tests/test_ppi_immutable_universe_snapshot_pilot.py
      - tests/test_ppi_immutable_universe_snapshot_artifact_review.py
      - tests/test_ppi_immutable_durable_workflow_identity.py

permissions:
  contents: read

jobs:
  offline-bridge-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull-request revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run zero-provider identity and immutable-snapshot regression tests
        env:
          NO_PROXY: '*'
        run: |
          export no_proxy="$NO_PROXY"
          python -m unittest \
            tests.test_ppi_public_first_chain_depth_bridge \
            tests.test_ppi_immutable_snapshot_review_bridge \
            tests.test_ppi_stable_instrument_id_allocation_artifact_review \
            tests.test_ppi_stable_instrument_id_allocation_durable_identity \
            tests.test_ppi_immutable_universe_snapshot_pilot \
            tests.test_ppi_immutable_universe_snapshot_artifact_review \
            tests.test_ppi_immutable_durable_workflow_identity -v
