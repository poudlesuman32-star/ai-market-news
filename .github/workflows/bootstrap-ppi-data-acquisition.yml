name: Bootstrap PPI public acquisition repository

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Exact public acquisition repository
        required: true
        default: spoudel2010-ux/ppi-data-acquisition
        type: string

permissions:
  contents: read

concurrency:
  group: bootstrap-ppi-public-acquisition
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PPI_CROSS_REPOSITORY_AUTOMATION: ${{ secrets.RAW_TOKEN }}
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
    steps:
      - name: Check out reviewed bootstrap code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Validate protected cross-repository configuration
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "spoudel2010-ux/ppi-data-acquisition"
          test -n "$PPI_CROSS_REPOSITORY_AUTOMATION"
          test "${#PPI_CROSS_REPOSITORY_AUTOMATION}" -ge 20

      - name: Validate source and generated target boundaries
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/bootstrap_ppi_data_acquisition.py \
            scripts/bootstrap_ppi_data_acquisition_r2.py \
            bootstrap/ppi-data-acquisition/src/collect_raw_provider_evidence.py \
            bootstrap/ppi-data-acquisition/src/collect_raw_provider_evidence_r2.py \
            bootstrap/ppi-data-acquisition/src/fetch_yfinance_expectations.py \
            bootstrap/ppi-data-acquisition/src/publish_private_handoff.py
          python -m unittest discover -s bootstrap/ppi-data-acquisition/tests -p "test_*.py" -v

          find bootstrap/ppi-data-acquisition -type f -name '*.pyc' -delete
          find bootstrap/ppi-data-acquisition -type d -name '__pycache__' -empty -delete
          test -z "$(find bootstrap/ppi-data-acquisition -type f -name '*.pyc' -print -quit)"

          python - <<'PY'
          import json
          from pathlib import Path

          source_workflow = Path('.github/workflows/bootstrap-ppi-data-acquisition.yml').read_text(encoding='utf-8')
          target_workflow = Path('bootstrap/ppi-data-acquisition/.github/workflows/collect-r11-public-evidence.yml').read_text(encoding='utf-8')
          bootstrap_r2 = Path('scripts/bootstrap_ppi_data_acquisition_r2.py').read_text(encoding='utf-8')
          helper = Path('bootstrap/ppi-data-acquisition/src/fetch_yfinance_expectations.py').read_text(encoding='utf-8')
          collector_source = Path('bootstrap/ppi-data-acquisition/src/collect_raw_provider_evidence.py').read_text(encoding='utf-8')
          collector_entrypoint = Path('bootstrap/ppi-data-acquisition/src/collect_raw_provider_evidence_r2.py').read_text(encoding='utf-8')
          legacy = json.loads(Path('bootstrap/ppi-data-acquisition/contracts/PPI-R11-PUBLIC-ACQUISITION-003.json').read_text(encoding='utf-8'))
          acquisition_r1 = json.loads(Path('bootstrap/ppi-data-acquisition/contracts/PPI-R11-PUBLIC-ACQUISITION-003-R1.json').read_text(encoding='utf-8'))
          acquisition_r2 = json.loads(Path('bootstrap/ppi-data-acquisition/contracts/PPI-R11-PUBLIC-ACQUISITION-003-R2.json').read_text(encoding='utf-8'))
          collector_r1 = json.loads(Path('bootstrap/ppi-data-acquisition/contracts/PPI-PUBLIC-COLLECTOR-003-R1.json').read_text(encoding='utf-8'))
          collector_r2 = json.loads(Path('bootstrap/ppi-data-acquisition/contracts/PPI-PUBLIC-COLLECTOR-003-R2.json').read_text(encoding='utf-8'))
          licensing = json.loads(Path('bootstrap/ppi-data-acquisition/config/provider_licensing_dispositions.json').read_text(encoding='utf-8'))
          scope = json.loads(Path('bootstrap/ppi-data-acquisition/config/r11_batch_003.json').read_text(encoding='utf-8'))

          assert '\n  workflow_dispatch:\n' in source_workflow
          assert '\n  schedule:\n' not in source_workflow
          assert '\n  repository_dispatch:\n' not in source_workflow
          expected_secret_binding = 'PPI_CROSS_REPOSITORY_AUTOMATION: $' + '{{ secrets.RAW_TOKEN }}'
          assert expected_secret_binding in source_workflow
          assert 'bootstrap_ppi_data_acquisition_r2.py' in source_workflow
          assert 'REQUIRED_R2_PATHS' in bootstrap_r2
          assert 'src/fetch_yfinance_expectations.py' in bootstrap_r2
          assert 'contracts/PPI-R11-PUBLIC-ACQUISITION-003-R2.json' in bootstrap_r2
          assert 'contracts/PPI-PUBLIC-COLLECTOR-003-R2.json' in bootstrap_r2
          assert '\n  workflow_dispatch:\n' in target_workflow
          assert '\n  schedule:\n' not in target_workflow
          assert '\n  repository_dispatch:\n' not in target_workflow
          assert 'PRIVATE_RELEASE_HANDOFF_ENABLED: true' in target_workflow
          assert "'yfinance==1.5.1'" in target_workflow
          assert 'src/collect_raw_provider_evidence_r2.py' in target_workflow
          assert 'ppi-r11-public-success-' in target_workflow
          assert 'ppi-r11-public-failure-' in target_workflow
          assert 'actions/checkout@v' not in target_workflow
          assert 'actions/upload-artifact@v' not in target_workflow
          assert 'EXPECTED_YFINANCE_VERSION = "1.5.1"' in helper
          assert '"function": "EARNINGS_ESTIMATES"' not in collector_source
          assert collector_source.count('"function": "NEWS_SENTIMENT"') == 1
          assert 'PPI-R11-PUBLIC-ACQUISITION-003-R2' in collector_entrypoint
          assert 'PPI-PUBLIC-COLLECTOR-003-R2' in collector_entrypoint
          assert scope['contract_id'] == 'PPI-R11-PUBLIC-ACQUISITION-003-R2'
          assert scope['private_contract_id'] == 'PPI-R11-BATCH-EVIDENCE-003-R1'
          assert scope['collector_release_id'] == 'PPI-PUBLIC-COLLECTOR-003-R2'
          assert scope['expected_bundle_count'] == 48
          assert scope['expected_path_count'] == 50
          assert scope['expected_provider_request_count'] == 49
          assert scope['expected_alpha_vantage_request_count'] == 12
          assert scope['authorized_actions'] == []
          assert legacy['status'] == 'superseded_before_target_collection'
          assert acquisition_r1['contract_id'] == 'PPI-R11-PUBLIC-ACQUISITION-003-R1'
          assert acquisition_r1['collector_release_id'] == 'PPI-PUBLIC-COLLECTOR-003-R1'
          assert collector_r1['provider_operations'][0] == 'alpha_vantage:EARNINGS_ESTIMATES'
          assert acquisition_r2['supersedes'] == acquisition_r1['contract_id']
          assert acquisition_r2['alpha_vantage_batch_request_count'] == 12
          assert acquisition_r2['private_dispatch_authorized'] is False
          assert acquisition_r2['registry_mutation_authorized'] is False
          assert acquisition_r2['authorized_actions'] == []
          assert collector_r2['supersedes'] == collector_r1['contract_id']
          assert collector_r2['alpha_vantage_batch_request_count'] == 12
          assert collector_r2['expected_path_count'] == 50
          assert collector_r2['public_raw_artifact_uploaded'] is False
          assert licensing['contract_id'] == acquisition_r2['contract_id']
          assert licensing['public_raw_artifact_policy'] == 'public_storage_prohibited'
          assert licensing['dispositions'][0]['provider'] == 'yahoo_finance_via_yfinance'
          assert all(item['disposition'] == 'private_repository_handoff' for item in licensing['dispositions'])
          PY

      - name: Create reviewed target bootstrap draft PR
        run: |
          set -euo pipefail
          python scripts/bootstrap_ppi_data_acquisition_r2.py
