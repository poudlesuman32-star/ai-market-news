name: PPI public 3000 offline contract review

on:
  pull_request:
    paths:
      - 'contracts/PPI-PUBLIC-3000-SNAPSHOT-001-R1.json'
      - 'schemas/ppi_public_3000_snapshot*.json'
      - 'scripts/validate_ppi_public_3000_snapshot_contract.py'
      - 'scripts/review_ppi_public_3000_snapshot_artifact.py'
      - 'tests/test_ppi_public_3000_snapshot*.py'
      - '.github/workflows/ppi-public-3000-offline-contract-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run zero-network contract and artifact-review tests
        env:
          NO_PROXY: '*'
          no_proxy: '*'
        run: |
          python -m unittest \
            tests.test_ppi_public_3000_snapshot_contract \
            tests.test_ppi_public_3000_snapshot_artifact_review \
            tests.test_ppi_public_3000_snapshot_schema_parity
